name: CI

# Pre-deploy gate for forgerpa.com (Astro 5 static site, deployed via Cloudflare).
# Two jobs run on every push and PR to main, in parallel:
#   - Build: the production build (`astro build`) must succeed, then a metadata
#     gate (`npm run check:metadata`) scans the built dist/ and fails on a
#     doubled "| Forge RPA" title suffix, a page without exactly one <h1>, or a
#     missing meta description.
#   - Check: `astro check` must report zero type errors under the repo's strict
#     tsconfig (astro/tsconfigs/strict).
# A failure in either blocks the change before it reaches the deploy path.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per ref; a new push cancels the superseded run to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: astro build
        run: npm run build

      - name: metadata gate
        run: npm run check:metadata

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: astro check
        run: npm run check
